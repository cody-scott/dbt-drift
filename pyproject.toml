[project]
name = "dbt-drift"
version = "0.1.0"
description = "Detect drift between a dbt manifest and Snowflake, and emit (never execute) the SQL to clean it up."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "snowflake-connector-python>=3.0",
    "cryptography>=41",
    "pyyaml>=6",
    "jinja2>=3",
]

[project.scripts]
dbt-drift = "dbt_drift.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dbt_drift"]
